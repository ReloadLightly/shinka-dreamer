  </g>
  <g id="text_46">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #6f6a78" transform="translate(10.08 597.247031)">Readiness and native novelty fixture calls are separate from discovery; a fixture does not prove the discovery judge ran.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #6f6a78" transform="translate(10.08 608.692781)">Local BGE embeddings truncate to 10,000 source characters and are not validated semantic code novelty.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #6f6a78" transform="translate(10.08 620.138531)">Native UCB reward updates are shifted/scaled feedback; allocation is not a controlled comparison of model quality.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #6f6a78" transform="translate(10.08 631.584281)">All mechanisms are enabled together. One search cannot establish reliable discovery or isolate a mechanism’s benefit.</text>
  </g>
 </g>
